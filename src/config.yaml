# Build-time settings.
#
# This is the only file outside `src/content/` that holds site text, because
# Astro needs the site URL and base path before it can read any content.
# Everything a client normally edits — page copy, navigation, team, openings,
# contact details — lives in `src/content/`. See CONTENT.md.

site:
  name: Dayi Tx
  site: 'https://example.com' # [REPLACE] production URL, no trailing slash
  base: '/'
  trailingSlash: false

# Default SEO metadata. Each page can override title/description in its own
# markdown file (`title:` and `description:` in the frontmatter).
metadata:
  title:
    default: Dayi Tx
    template: '%s — Dayi'
  description: '[REPLACE] One sentence describing what the company does.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Dayi Tx
    images:
      - url: '~/assets/images/default.png' # [REPLACE] 1200×628 social sharing image
        width: 1200
        height: 628
    type: website

i18n:
  language: en
  textDirection: ltr

ui:
  theme: 'light:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
